name: Benchmark result
description: Share a measured speed comparison (DropBridge vs AirDrop, Quick Share, LocalSend, …)
title: "Benchmark: <phone> ⇄ <computer>"
labels: [benchmark]
body:
  - type: markdown
    attributes:
      value: Thanks! Only measured numbers please. Same files, same room, same network for every app.
  - type: input
    id: devices
    attributes: { label: Devices, description: "Phone model + OS, computer model + OS", placeholder: "Pixel 8 (Android 15) ⇄ MacBook Air M3 (macOS 15)" }
    validations: { required: true }
  - type: input
    id: network
    attributes: { label: Network, placeholder: "Wi-Fi 6 router, 5 GHz, Mac 3 m away / phone hotspot / Mac on Ethernet" }
    validations: { required: true }
  - type: textarea
    id: results
    attributes:
      label: Results
      description: Time or MB/s for each app and direction.
      value: |
        | App | Version | 1 GB phone→computer | 1 GB computer→phone | 1,000 small files |
        |---|---|---|---|---|
        | DropBridge | 0.1.0 | | | |
        | AirDrop / Quick Share / LocalSend | | | | |
    validations: { required: true }
  - type: textarea
    id: notes
    attributes: { label: How you measured, description: "Stopwatch, app's own number, number of runs…" }
