name: Release
on:
  push: { tags: ["v*"] }
  workflow_dispatch:

permissions: { contents: write }

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, bundles: "app,dmg" }
          - { os: macos-latest, target: x86_64-apple-darwin, bundles: "app,dmg" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, bundles: "msi,nsis" }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, bundles: "deb,appimage" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config
      - run: cargo install tauri-cli --version 2.12.3 --locked
      - name: Set version from tag
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"; [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || V=0.1.0
          sed -i.bak "s/\"version\": \"[^\"]*\"/\"version\": \"$V\"/" desktop/src-tauri/tauri.conf.json
      - name: Build
        working-directory: desktop/src-tauri
        # For signed/notarised macOS builds add APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
        # APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID as env from secrets here.
        run: cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Collect
        shell: bash
        run: |
          mkdir out; B=target/${{ matrix.target }}/release/bundle
          find $B \( -name "*.dmg" -o -name "*.msi" -o -name "*-setup.exe" -o -name "*.deb" -o -name "*.AppImage" \) -exec cp {} out/ \;
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: "desktop-${{ matrix.target }}", path: out/* }

  cli:
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p dropbridge-cli --target ${{ matrix.target }}
      - shell: bash
        run: |
          mkdir out; EXT=""; [ "$RUNNER_OS" = Windows ] && EXT=.exe
          cp target/${{ matrix.target }}/release/dropbridge$EXT out/dropbridge-${{ matrix.target }}$EXT
      - uses: actions/upload-artifact@v4
        with: { name: "cli-${{ matrix.target }}", path: out/* }

  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android" }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: cargo install cargo-ndk --locked
      - name: Keystore
        env: { KS: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" }
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > $RUNNER_TEMP/ks.jks; echo "DROPBRIDGE_KEYSTORE=$RUNNER_TEMP/ks.jks" >> $GITHUB_ENV; fi
          V="${GITHUB_REF_NAME#v}"; [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || V=0.1.0
          echo "DROPBRIDGE_VERSION=$V" >> $GITHUB_ENV
          echo "DROPBRIDGE_VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV
      - run: scripts/build-android.sh release
        env:
          DROPBRIDGE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DROPBRIDGE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DROPBRIDGE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: mkdir out && cp android/app/build/outputs/apk/release/app-release.apk "out/DropBridge-${DROPBRIDGE_VERSION}.apk"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/* }

  publish:
    needs: [desktop, cli, android]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Stable file names (website links to releases/latest/download/<name>)
        run: |
          cd dist
          for f in *; do
            case "$f" in
              *aarch64.dmg) n=DropBridge-macOS-AppleSilicon.dmg ;;
              *x64.dmg) n=DropBridge-macOS-Intel.dmg ;;
              *.msi) n=DropBridge-Windows-x64.msi ;;
              *-setup.exe) n=DropBridge-Windows-x64-setup.exe ;;
              *.AppImage) n=DropBridge-Linux-x86_64.AppImage ;;
              *.deb) n=DropBridge-Linux-amd64.deb ;;
              *.apk) n=DropBridge-Android.apk ;;
              *) continue ;;
            esac
            mv "$f" "$n"
          done
          ls -la
      - run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
